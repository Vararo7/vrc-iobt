name: Build Quest 3 Binder Access Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build requirements
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate standalone Binder probe source
        shell: bash
        run: |
          mkdir -p '.'
          cat > 'settings.gradle' <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'QuestIOBTBinderProbe'
          include ':app'
          EOF_0

          mkdir -p '.'
          cat > 'build.gradle' <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_1

          mkdir -p 'app'
          cat > 'app/build.gradle' <<'EOF_2'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'dev.quest.iobt.binderprobe'
              compileSdk 35
              ndkVersion '27.3.13750724'

              defaultConfig {
                  applicationId 'dev.quest.iobt.binderprobe'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.22.1'
                  }
              }
          }
          EOF_2

          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_3'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Quest Binder Probe"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name=".ProbeReceiver"
                      android:exported="true" />
              </application>
          </manifest>
          EOF_3

          mkdir -p 'app/src/main/java/dev/quest/iobt/binderprobe'
          cat > 'app/src/main/java/dev/quest/iobt/binderprobe/ProbeRunner.java' <<'EOF_4'
          package dev.quest.iobt.binderprobe;

          import android.util.Log;

          public final class ProbeRunner {
              public static final String TAG = "QuestBinderProbe";
              static {
                  System.loadLibrary("binderprobe");
              }

              private ProbeRunner() {}

              public static native String query();

              public static String runAndLog(String source) {
                  String result = "SOURCE=" + source + "\n" + query();
                  Log.i(TAG, "RESULT_BEGIN " + source);
                  for (String line : result.split("\n")) {
                      Log.i(TAG, line);
                  }
                  Log.i(TAG, "RESULT_END " + source);
                  return result;
              }
          }
          EOF_4

          mkdir -p 'app/src/main/java/dev/quest/iobt/binderprobe'
          cat > 'app/src/main/java/dev/quest/iobt/binderprobe/MainActivity.java' <<'EOF_5'
          package dev.quest.iobt.binderprobe;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public final class MainActivity extends Activity {
              private TextView results;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(28, 28, 28, 28);

                  TextView intro = new TextView(this);
                  intro.setText("Quest 3 Binder Access Probe\nChecks service lookup and ping only. No body poses are read.\nRun a background check using ADB while VRChat is open.");
                  intro.setTextSize(17);
                  layout.addView(intro);

                  Button button = new Button(this);
                  button.setText("Check Binder access");
                  button.setOnClickListener(v -> doProbe());
                  layout.addView(button);

                  results = new TextView(this);
                  results.setTextSize(13);
                  layout.addView(results);
                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(layout);
                  setContentView(scroll);
                  doProbe();
              }

              private void doProbe() {
                  try {
                      results.setText(ProbeRunner.runAndLog("foreground-activity"));
                  } catch (Throwable t) {
                      android.util.Log.e(ProbeRunner.TAG, "Probe failed", t);
                      results.setText("ERROR: " + t);
                  }
              }
          }
          EOF_5

          mkdir -p 'app/src/main/java/dev/quest/iobt/binderprobe'
          cat > 'app/src/main/java/dev/quest/iobt/binderprobe/ProbeReceiver.java' <<'EOF_6'
          package dev.quest.iobt.binderprobe;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.util.Log;

          public final class ProbeReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      ProbeRunner.runAndLog("background-broadcast");
                  } catch (Throwable t) {
                      Log.e(ProbeRunner.TAG, "Background probe failed", t);
                  }
              }
          }
          EOF_6

          mkdir -p 'app/src/main/cpp'
          cat > 'app/src/main/cpp/CMakeLists.txt' <<'EOF_7'
          cmake_minimum_required(VERSION 3.22.1)
          project(quest_binder_probe LANGUAGES CXX)
          add_library(binderprobe SHARED binder_probe.cpp)
          target_compile_features(binderprobe PRIVATE cxx_std_17)
          target_link_libraries(binderprobe binder_ndk log)
          EOF_7

          mkdir -p 'app/src/main/cpp'
          cat > 'app/src/main/cpp/binder_probe.cpp' <<'EOF_8'
          #include <jni.h>
          #include <android/binder_manager.h>
          #include <android/binder_ibinder.h>
          #include <android/binder_status.h>
          #include <sstream>
          #include <string>

          extern "C" JNIEXPORT jstring JNICALL
          Java_dev_quest_iobt_binderprobe_ProbeRunner_query(JNIEnv* env, jclass) {
              const char* names[] = {
                  "activity", // Positive control: a common Android system service
                  "oculus.internal.tracking.IInsideOutBodyTrackingService/default",
                  "oculus.internal.ITrackingFidelityService/default",
                  "oculus.internal.tracking.IMemoryBrokerService/default",
                  "com.example.service.not.real" // Negative control
              };
              std::ostringstream report;
              for (const char* name : names) {
                  AIBinder* service = AServiceManager_checkService(name);
                  report << "SERVICE=" << name << " ";
                  if (service == nullptr) {
                      report << "LOOKUP=NULL (missing OR access denied)\n";
                      continue;
                  }
                  const binder_status_t status = AIBinder_ping(service);
                  report << "LOOKUP=HANDLE PING=" << static_cast<int>(status)
                         << " REMOTE=" << (AIBinder_isRemote(service) ? "true" : "false")
                         << "\n";
                  AIBinder_decStrong(service);
              }
              return env->NewStringUTF(report.str().c_str());
          }
          EOF_8

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-Binder-Access-Probe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
