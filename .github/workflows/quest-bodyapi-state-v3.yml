name: Build Quest 3 Body API State Diagnostic v3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build requirements
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate project source
        shell: bash
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'__QUEST_BODY_V3_0_END__'
          plugins { id 'com.android.application' }
          android {
            namespace 'dev.quest.iobt.bodyapistatev3'
            compileSdk 35
            ndkVersion '27.3.13750724'
            defaultConfig {
              applicationId 'dev.quest.iobt.bodyapistatev3'
              minSdk 29
              targetSdk 34
              versionCode 3
              versionName '3.0'
              ndk { abiFilters 'arm64-v8a' }
            }
            externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
          }
          __QUEST_BODY_V3_0_END__
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'__QUEST_BODY_V3_1_END__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Quest Body API State Diagnostic v3" android:allowBackup="false"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <uses-native-library android:name="libripcclient.oculus.so" android:required="false" />
              <uses-native-library android:name="libripcmanager.oculus.so" android:required="false" />
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <receiver android:name=".ProbeReceiver" android:exported="true" android:process=":ripc_probe" />
            </application>
          </manifest>
          __QUEST_BODY_V3_1_END__
          mkdir -p 'app/src/main/cpp'
          cat > 'app/src/main/cpp/CMakeLists.txt' <<'__QUEST_BODY_V3_2_END__'
          cmake_minimum_required(VERSION 3.22.1)
          project(quest_ripc_connect_probe LANGUAGES CXX)
          add_library(ripcconnectprobe SHARED ripc_connect_probe.cpp)
          target_compile_features(ripcconnectprobe PRIVATE cxx_std_17)
          target_link_libraries(ripcconnectprobe dl log)
          __QUEST_BODY_V3_2_END__
          mkdir -p 'app/src/main/cpp'
          cat > 'app/src/main/cpp/ripc_connect_probe.cpp' <<'__QUEST_BODY_V3_3_END__'
          #include <jni.h>
          #include <dlfcn.h>
          #include <android/log.h>
          #include <algorithm>
          #include <array>
          #include <chrono>
          #include <cstdint>
          #include <cstring>
          #include <sstream>
          #include <string>
          #include <thread>
          
          namespace {
          constexpr char kTag[] = "QuestBodyV3";
          // Kept identical to the already successful initialization in v2.
          struct alignas(8) ExperimentalPlatformContext { std::uint64_t reserved[4]{}; };
          static_assert(sizeof(ExperimentalPlatformContext) == 32);
          using VersionFn = std::uint32_t (*)();
          using InitializedFn = bool (*)();
          using InitFn = std::uint32_t (*)(const void*);
          using ConnectFn = std::uint32_t (*)(const char*, const char*, const char*);
          using StateFn = std::uint32_t (*)(std::uint32_t, const char*);
          using SizeFn = std::uint64_t (*)(std::uint32_t);
          // Reconstructed from Meta's ARM64 RuntimeIPC v90 binary and its own call site:
          //  x0: 32-bit named state handle
          //  x1: pointer to 32-bit read/index output (sp+0x58 at the internal call site)
          //  x2: pointer to 64-bit state-object output (sp+0x48 at the internal call site)
          //  x3: pointer to 32-bit data length output (sp+0x54 at the internal call site)
          //  return: pointer to data, or NULL.
          using BeginV2Fn = const void* (*)(std::uint32_t, std::uint32_t*, const void**, std::uint32_t*);
          // Internal caller passes x0=state handle, w1=read index, x2=state object,
          // x3=pointer to 1-byte flag.  Only call this after non-NULL BeginV2.
          using EndV2Fn = bool (*)(std::uint32_t, std::uint32_t, const void*, bool*);
          struct State {
              const char* name;
              std::uint32_t id=0;
              std::uint64_t cap=0;
              bool hadPrevious=false;
              std::uint64_t previousHash=0;
          };
          constexpr const char* kNames[] = {
              "serviceInfo_", "bodyState_", "bodyStateExtra_", "bodyCodec_",
              "bodyPoseFullBody_", "bodySkeletonFullBody_", "bodyPose_", "bodySkeleton_"
          };
          template<typename Fn>
          Fn loadSymbol(void* lib, const char* name, std::ostringstream& out) {
              dlerror();
              void* ptr=dlsym(lib,name);
              const char* error=dlerror();
              out << "SYMBOL " << name << "=" << ((!error && ptr)?"FOUND":"MISSING") << "\n";
              return (!error && ptr)?reinterpret_cast<Fn>(ptr):nullptr;
          }
          std::uint64_t hashBytes(const void* ptr, std::size_t n) {
              const auto* p=static_cast<const std::uint8_t*>(ptr);
              std::uint64_t h=14695981039346656037ull;
              for(std::size_t i=0;i<n;++i){ h^=p[i];h*=1099511628211ull; }
              return h;
          }
          std::string jstringText(JNIEnv* env,jstring in,const char* fallback) {
              if(!in) return fallback;
              const char* s=env->GetStringUTFChars(in,nullptr);
              if(!s) return fallback;
              std::string result(s);env->ReleaseStringUTFChars(in,s);return result;
          }
          }
          extern "C" JNIEXPORT jstring JNICALL
          Java_dev_quest_iobt_bodyapistatev3_ProbeRunner_nativeRun(JNIEnv* env,jclass,
              jstring stageText,jstring contextText) {
              const auto stage=jstringText(env,stageText,"diagnose");
              const auto context=jstringText(env,contextText,"unspecified");
              const bool sampling=(stage=="sample");
              std::ostringstream out;
              out << "DIAGNOSTIC_VERSION=3\n"
                  << "STAGE=" << stage << "\n"
                  << "CONTEXT_LABEL=" << context << " (user-supplied, not independently verified)\n"
                  << "SERVER=BodyApiServiceServer\n"
                  << "POSE_COORDINATES_LOGGED=NO\n";
              void* lib=dlopen("libripcclient.oculus.so", RTLD_NOW|RTLD_LOCAL);
              if(!lib){out<<"ABORT=RIPC_LIBRARY_UNAVAILABLE\n";return env->NewStringUTF(out.str().c_str());}
              const auto version=loadSymbol<VersionFn>(lib,"ipc_GetRuntimeVersion",out);
              const auto initialized=loadSymbol<InitializedFn>(lib,"ipc_IsInitialized",out);
              const auto init=loadSymbol<InitFn>(lib,"ipc_Initialize",out);
              const auto connect=loadSymbol<ConnectFn>(lib,"ipc_ConnectToServer",out);
              const auto getState=loadSymbol<StateFn>(lib,"ipc_GetServerState",out);
              const auto getSize=loadSymbol<SizeFn>(lib,"ipc_GetServerStateMaxSize",out);
              const auto begin=loadSymbol<BeginV2Fn>(lib,"ipc_GetServerStateDataBegin_V2",out);
              const auto end=loadSymbol<EndV2Fn>(lib,"ipc_GetServerStateDataEnd_V2",out);
              if(!version || version()!=90){out<<"ABORT=RUNTIME_NOT_90\n";dlclose(lib);return env->NewStringUTF(out.str().c_str());}
              out<<"RUNTIME_VERSION="<<version()<<"\n";
              if(!initialized||!init||!connect||!getState||!getSize||!begin||!end){
                  out<<"ABORT=MISSING_API_SYMBOL\n";dlclose(lib);return env->NewStringUTF(out.str().c_str());
              }
              if(!initialized()){
                  ExperimentalPlatformContext ctx{};
                  __android_log_print(ANDROID_LOG_INFO,kTag,"NATIVE_STAGE=BEFORE_INITIALIZE");
                  out<<"INITIALIZE_RAW="<<init(&ctx)<<"\n";
              }
              if(!initialized()){out<<"ABORT=INITIALIZE_FAILED\n";dlclose(lib);return env->NewStringUTF(out.str().c_str());}
              __android_log_print(ANDROID_LOG_INFO,kTag,"NATIVE_STAGE=BEFORE_CONNECT");
              const std::uint32_t client=connect("com.oculus.bodyapiservice","com.oculus.bodyapiservice","BodyApiServiceServer");
              __android_log_print(ANDROID_LOG_INFO,kTag,"NATIVE_STAGE=AFTER_CONNECT client=%u",client);
              out<<"CLIENT_HANDLE="<<client<<"\n";
              if(!client){out<<"ABORT=NO_CLIENT_HANDLE\n";dlclose(lib);return env->NewStringUTF(out.str().c_str());}
              std::array<State,8> states{};
              for(std::size_t i=0;i<states.size();++i)states[i].name=kNames[i];
              for(int round=0;round<3;++round) {
                  if(round)std::this_thread::sleep_for(std::chrono::milliseconds(650));
                  out<<"ROUND="<<round<<"\n";
                  for(auto& s:states){
                      s.id=getState(client,s.name);
                      if(!s.id){out<<"STATE "<<s.name<<" PRESENT=NO\n";continue;}
                      s.cap=getSize(s.id);
                      out<<"STATE "<<s.name<<" PRESENT=YES MAX_BYTES="<<s.cap<<"\n";
                      // Distinct canaries reveal whether BeginV2 writes the outputs.
                      std::uint32_t readIndex=0xA5A5A5A5u;
                      const void* stateObject=nullptr;
                      std::uint32_t byteCount=0x5A5A5A5Au;
                      __android_log_print(ANDROID_LOG_INFO,kTag,"NATIVE_STAGE=BEFORE_BEGIN_V2 round=%d state=%s",round,s.name);
                      const void* data=begin(s.id,&readIndex,&stateObject,&byteCount);
                      __android_log_print(ANDROID_LOG_INFO,kTag,"NATIVE_STAGE=AFTER_BEGIN_V2 round=%d state=%s nonNull=%d",round,s.name,int(data!=nullptr));
                      out<<"BEGIN_V2 "<<s.name<<" PTR="<<(data?"NON_NULL":"NULL")
                         <<" READ_INDEX_SET="<<(readIndex==0xA5A5A5A5u?"NO":"YES")
                         <<" STATE_OBJECT_SET="<<(stateObject?"YES":"NO")
                         <<" LENGTH_SET="<<(byteCount==0x5A5A5A5Au?"NO":"YES");
                      if(byteCount!=0x5A5A5A5Au)out<<" DATA_BYTES="<<byteCount;
                      out<<"\n";
                      if(!data)continue; // Never End unless Begin returned valid data.
                      // Read only a tightly bounded prefix, and only upon explicit
                      // 'sample' stage. No raw values or coordinates are logged.
                      if(sampling && byteCount!=0x5A5A5A5Au && s.cap>0){
                          const std::size_t n=std::min<std::size_t>({32u,static_cast<std::size_t>(byteCount),static_cast<std::size_t>(s.cap)});
                          if(n){
                              const std::uint64_t digest=hashBytes(data,n);
                              out<<"SAMPLE "<<s.name<<" BYTES="<<n
                                 <<" CHANGED="<<(s.hadPrevious?(digest==s.previousHash?"NO":"YES"):"UNKNOWN_FIRST")<<"\n";
                              s.hadPrevious=true;s.previousHash=digest;
                          }
                      }
                      bool changedFlag=false;
                      __android_log_print(ANDROID_LOG_INFO,kTag,"NATIVE_STAGE=BEFORE_END_V2 round=%d state=%s",round,s.name);
                      bool endOk=end(s.id,readIndex,stateObject,&changedFlag);
                      __android_log_print(ANDROID_LOG_INFO,kTag,"NATIVE_STAGE=AFTER_END_V2 round=%d state=%s",round,s.name);
                      out<<"END_V2 "<<s.name<<" RESULT="<<(endOk?"OK":"FAILED")
                         <<" CHANGE_FLAG="<<(changedFlag?"YES":"NO")<<"\n";
                  }
              }
              out<<"POSE_CONTENT_EXPORTED=NO\n"
                 <<"TRACKING_ACTIVATION_REQUESTED=NO\n"
                 <<"FRESHNESS_UNPROVEN=YES\n";
              dlclose(lib);
              return env->NewStringUTF(out.str().c_str());
          }
          __QUEST_BODY_V3_3_END__
          mkdir -p 'app/src/main/java/dev/quest/iobt/bodyapistatev3'
          cat > 'app/src/main/java/dev/quest/iobt/bodyapistatev3/MainActivity.java' <<'__QUEST_BODY_V3_4_END__'
          package dev.quest.iobt.bodyapistatev3;
          
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          
          public final class MainActivity extends Activity {
              @Override public void onCreate(Bundle state){
                  super.onCreate(state);
                  TextView view=new TextView(this);
                  view.setTextSize(17f);
                  view.setPadding(24,24,24,24);
                  view.setText("Quest Body API State Diagnostic v3\n\nRun the ADB broadcast while standalone VRChat or the known working IOBT demo is active. No tracking changes requested.");
                  setContentView(view);
              }
          }
          __QUEST_BODY_V3_4_END__
          mkdir -p 'app/src/main/java/dev/quest/iobt/bodyapistatev3'
          cat > 'app/src/main/java/dev/quest/iobt/bodyapistatev3/ProbeReceiver.java' <<'__QUEST_BODY_V3_5_END__'
          package dev.quest.iobt.bodyapistatev3;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          
          public final class ProbeReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context ctx, Intent intent) {
                  final String requestedStage = intent.getStringExtra("stage");
                  final String stage = "sample".equals(requestedStage) ? "sample" : "diagnose";
                  final String requestedContext = intent.getStringExtra("context");
                  final String label = "vrchat".equals(requestedContext) ? "vrchat" :
                                       "demo".equals(requestedContext) ? "demo" : "unspecified";
                  final PendingResult pending = goAsync();
                  new Thread(() -> {
                      try { ProbeRunner.run(stage,label); }
                      finally { pending.finish(); }
                  }, "quest-body-v3-probe").start();
              }
          }
          __QUEST_BODY_V3_5_END__
          mkdir -p 'app/src/main/java/dev/quest/iobt/bodyapistatev3'
          cat > 'app/src/main/java/dev/quest/iobt/bodyapistatev3/ProbeRunner.java' <<'__QUEST_BODY_V3_6_END__'
          package dev.quest.iobt.bodyapistatev3;
          
          import android.util.Log;
          
          final class ProbeRunner {
              static final String TAG = "QuestBodyV3";
              static { System.loadLibrary("ripcconnectprobe"); }
              private static native String nativeRun(String stage, String context);
          
              static void run(String stage, String context) {
                  Log.i(TAG, "RESULT_BEGIN stage="+stage+" context="+context);
                  try {
                      String result = nativeRun(stage, context);
                      for(String line : result.split("\n")) Log.i(TAG,line);
                  } catch(Throwable t) { Log.e(TAG,"PROBE_ERROR",t); }
                  Log.i(TAG, "RESULT_END stage="+stage+" context="+context);
              }
          }
          __QUEST_BODY_V3_6_END__
          mkdir -p '.'
          cat > 'build.gradle' <<'__QUEST_BODY_V3_7_END__'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          __QUEST_BODY_V3_7_END__
          mkdir -p '.'
          cat > 'settings.gradle' <<'__QUEST_BODY_V3_8_END__'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'QuestBodyAPIStateProbe'
          include ':app'
          __QUEST_BODY_V3_8_END__
      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-BodyAPI-StateDiagnosticV3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
