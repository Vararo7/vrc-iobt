name: Build Quest 3 IOBT overlay-panel probe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo (including the working build.yml)
        uses: actions/checkout@v4

      - name: Check out Meta Spatial SDK samples
        uses: actions/checkout@v4
        with:
          repository: meta-quest/Meta-Spatial-SDK-Samples
          path: meta-samples
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Reuse working lifecycle-probe patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          path = Path('.github/workflows/build.yml')
          if not path.is_file():
              raise SystemExit('Expected the existing .github/workflows/build.yml; keep that file unchanged.')
          lines = path.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if "python3 - <<'PY'" in line]
          if len(starts) != 1:
              raise SystemExit(f'Expected one Python patch in build.yml, found {len(starts)}')
          start = starts[0] + 1
          end = next((i for i in range(start, len(lines)) if lines[i].strip() == 'PY'), None)
          if end is None:
              raise SystemExit('Missing PY end marker in build.yml')
          code = textwrap.dedent('\n'.join(lines[start:end]))
          exec(compile(code, str(path) + ':probe_patch', 'exec'), {'__name__': '__main__'})
          PY

      - name: Add 2D overlay activity to the existing probe APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('meta-samples/BodyTrackingSample/app/src/main/java/com/meta/spatial/samples/bodytrackingsample')
          manifest = Path('meta-samples/BodyTrackingSample/app/src/main/AndroidManifest.xml')
          assert src.is_dir() and manifest.exists(), 'Meta changed its sample file layout.'
          panel = src / 'ProbePanelActivity.kt'
          panel.write_text('''package com.meta.spatial.samples.bodytrackingsample

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.util.Log
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class ProbePanelActivity : Activity() {
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var status: TextView
              private val poll = object : Runnable {
                  override fun run() {
                      val now = SystemClock.elapsedRealtime()
                      val lastTick = ProbeService.lastTickMs
                      val lastValid = ProbeService.lastValidMs
                      val tickAge = if (lastTick == 0L) -1 else now - lastTick
                      val poseAge = if (lastValid == 0L) -1 else now - lastValid
                      status.text = "IOBT 2D OVERLAY PROBE\\n\\n" +
                          "Panel is running. This does NOT mean tracking is running.\\n\\n" +
                          "XR frame age: $tickAge ms\\n" +
                          "Last valid body-pose age: $poseAge ms\\n" +
                          "Last valid joint count: ${ProbeService.lastValidCount}\\n\\n" +
                          "If the pose age continuously increases, XR tracking has stopped."
                      Log.i("QuestIOBTProbe", "PANEL state tickAgeMs=$tickAge validPoseAgeMs=$poseAge lastValidJoints=${ProbeService.lastValidCount}")
                      handler.postDelayed(this, 2000L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Log.i("QuestIOBTProbe", "PANEL onCreate")
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(30, 24, 30, 24)
                      setBackgroundColor(Color.rgb(19, 24, 32))
                  }
                  status = TextView(this).apply {
                      textSize = 17f
                      setTextColor(Color.WHITE)
                  }
                  layout.addView(status)
                  setContentView(layout)
                  try {
                      startForegroundService(Intent(this, ProbeService::class.java))
                  } catch (e: Exception) {
                      Log.e("QuestIOBTProbe", "PANEL could not start service", e)
                  }
              }
              override fun onResume() {
                  super.onResume()
                  Log.i("QuestIOBTProbe", "PANEL onResume")
                  handler.post(poll)
              }
              override fun onPause() {
                  handler.removeCallbacks(poll)
                  Log.w("QuestIOBTProbe", "PANEL onPause")
                  super.onPause()
              }
              override fun onStop() {
                  Log.w("QuestIOBTProbe", "PANEL onStop")
                  super.onStop()
              }
              override fun onDestroy() {
                  handler.removeCallbacks(poll)
                  Log.w("QuestIOBTProbe", "PANEL onDestroy")
                  super.onDestroy()
              }
          }
          ''')
          text = manifest.read_text()
          anchor = '</application>'
          if text.count(anchor) != 1:
              raise RuntimeError('Unexpected AndroidManifest application structure')
          addition = '''    <activity
            android:name="com.meta.spatial.samples.bodytrackingsample.ProbePanelActivity"
            android:label="IOBT Overlay Probe"
            android:exported="true"
            android:resizeableActivity="true">
            <intent-filter>
              <action android:name="android.intent.action.MAIN" />
              <category android:name="com.oculus.intent.category.2D" />
              <category android:name="com.oculus.intent.category.OVERLAY_LAUNCHER" />
            </intent-filter>
          </activity>
          </application>'''
          manifest.write_text(text.replace(anchor, addition, 1))
          print('Added 2D overlay activity to lifecycle probe, without modifying VRChat.')
          PY

      - name: Build debug APK
        working-directory: meta-samples/BodyTrackingSample
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload overlay-panel APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-IOBT-Overlay-Probe-debug-apk
          path: meta-samples/BodyTrackingSample/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
