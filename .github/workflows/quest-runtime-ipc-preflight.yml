name: Build Quest 3 Runtime IPC Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build requirements
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate project source
        shell: bash
        run: |
          mkdir -p '.'
          cat > 'settings.gradle' <<'__IPCPROBE_FILE_0__'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'QuestRuntimeIPCPreflight'
          include ':app'
          __IPCPROBE_FILE_0__
          mkdir -p '.'
          cat > 'build.gradle' <<'__IPCPROBE_FILE_1__'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          __IPCPROBE_FILE_1__
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'__IPCPROBE_FILE_2__'
          plugins { id 'com.android.application' }
          android {
            namespace 'dev.quest.iobt.ipcprobe'
            compileSdk 35
            ndkVersion '27.3.13750724'
            defaultConfig {
              applicationId 'dev.quest.iobt.ipcprobe'
              minSdk 29
              targetSdk 34
              versionCode 1
              versionName '1.0'
              ndk { abiFilters 'arm64-v8a' }
            }
            externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
          }
          __IPCPROBE_FILE_2__
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'__IPCPROBE_FILE_3__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries><package android:name="com.oculus.bodyapiservice" /></queries>
            <application android:label="Quest Runtime IPC Preflight" android:allowBackup="false"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <receiver android:name=".ProbeReceiver" android:exported="true"
                  android:process=":ipc_probe" />
            </application>
          </manifest>
          __IPCPROBE_FILE_3__
          mkdir -p 'app/src/main/java/dev/quest/iobt/ipcprobe'
          cat > 'app/src/main/java/dev/quest/iobt/ipcprobe/ProbeRunner.java' <<'__IPCPROBE_FILE_4__'
          package dev.quest.iobt.ipcprobe;
          
          import android.content.Context;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.util.Log;
          
          final class ProbeRunner {
            static final String TAG = "QuestIPCProbe";
            static { System.loadLibrary("ipcpreflight"); }
            private static native String inspectNative(String nativeLibraryDir);
          
            static String run(Context ctx, String source) {
              String nativeLibDir = "";
              try {
                ApplicationInfo info = ctx.getPackageManager().getApplicationInfo(
                    "com.oculus.bodyapiservice", 0);
                nativeLibDir = info.nativeLibraryDir == null ? "" : info.nativeLibraryDir;
              } catch (PackageManager.NameNotFoundException e) {
                nativeLibDir = "<package-not-visible>";
              }
              String result = "SOURCE=" + source + "\n"
                  + "ANDROID=" + Build.VERSION.RELEASE + " API=" + Build.VERSION.SDK_INT + "\n"
                  + "BODYAPI_LIBDIR=" + nativeLibDir + "\n"
                  + inspectNative(nativeLibDir);
              Log.i(TAG, "RESULT_BEGIN " + source);
              for (String line : result.split("\n")) Log.i(TAG, line);
              Log.i(TAG, "RESULT_END " + source);
              return result;
            }
          }
          __IPCPROBE_FILE_4__
          mkdir -p 'app/src/main/java/dev/quest/iobt/ipcprobe'
          cat > 'app/src/main/java/dev/quest/iobt/ipcprobe/MainActivity.java' <<'__IPCPROBE_FILE_5__'
          package dev.quest.iobt.ipcprobe;
          
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.ScrollView;
          import android.widget.TextView;
          
          public final class MainActivity extends Activity {
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              TextView tv = new TextView(this);
              tv.setTextSize(12f); tv.setPadding(24,24,24,24);
              ScrollView sc = new ScrollView(this); sc.addView(tv); setContentView(sc);
              try { tv.setText(ProbeRunner.run(this, "foreground")); }
              catch (Throwable e) { tv.setText("ERROR: " + e); }
            }
          }
          __IPCPROBE_FILE_5__
          mkdir -p 'app/src/main/java/dev/quest/iobt/ipcprobe'
          cat > 'app/src/main/java/dev/quest/iobt/ipcprobe/ProbeReceiver.java' <<'__IPCPROBE_FILE_6__'
          package dev.quest.iobt.ipcprobe;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.util.Log;
          
          public final class ProbeReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              try { ProbeRunner.run(c, "background-broadcast"); }
              catch (Throwable t) { Log.e(ProbeRunner.TAG, "Probe failure", t); }
            }
          }
          __IPCPROBE_FILE_6__
          mkdir -p 'app/src/main/cpp'
          cat > 'app/src/main/cpp/CMakeLists.txt' <<'__IPCPROBE_FILE_7__'
          cmake_minimum_required(VERSION 3.22.1)
          project(quest_ipc_preflight LANGUAGES CXX)
          add_library(ipcpreflight SHARED ipc_preflight.cpp)
          target_compile_features(ipcpreflight PRIVATE cxx_std_17)
          target_link_libraries(ipcpreflight dl)
          __IPCPROBE_FILE_7__
          mkdir -p 'app/src/main/cpp'
          cat > 'app/src/main/cpp/ipc_preflight.cpp' <<'__IPCPROBE_FILE_8__'
          #include <jni.h>
          #include <dlfcn.h>
          #include <sstream>
          #include <string>
          #include <cstdint>
          
          static std::string errorOrNone() {
            const char* e = dlerror();
            return e ? std::string(e) : std::string("none");
          }
          
          // Only dynamically link libraries and resolve named symbols: no private APIs invoked.
          static void inspectLib(std::ostringstream& out, const std::string& label,
                                 const std::string& path, const char* symbol) {
            dlerror();
            void* handle = dlopen(path.c_str(), RTLD_NOW | RTLD_LOCAL);
            if (!handle) {
              out << "LIB " << label << " OPEN=FAIL ERROR=" << errorOrNone() << "\n";
              return;
            }
            out << "LIB " << label << " OPEN=OK";
            if (symbol) {
              dlerror();
              void* address = dlsym(handle, symbol);
              const char* e = dlerror();
              out << " SYMBOL=" << symbol << " FOUND=" << (address != nullptr && !e ? "YES" : "NO");
            }
            out << "\n";
            dlclose(handle);
          }
          
          static void checkBinder(std::ostringstream& out, const char* name,
                                  void* lib, void* checkRaw, void* pingRaw,
                                  void* releaseRaw) {
            (void)lib;
            if (!checkRaw || !releaseRaw) {
              out << "SERVICE " << name << " LOOKUP=API_MISSING\n";
              return;
            }
            using CheckService = void* (*)(const char*);
            using Ping = int32_t (*)(void*);
            using Release = void (*)(void*);
            void* binder = reinterpret_cast<CheckService>(checkRaw)(name);
            if (!binder) {
              out << "SERVICE " << name << " LOOKUP=NULL\n";
              return;
            }
            out << "SERVICE " << name << " LOOKUP=HANDLE";
            if (pingRaw) out << " PING=" << reinterpret_cast<Ping>(pingRaw)(binder);
            out << "\n";
            reinterpret_cast<Release>(releaseRaw)(binder);
          }
          
          extern "C" JNIEXPORT jstring JNICALL
          Java_dev_quest_iobt_ipcprobe_ProbeRunner_inspectNative(JNIEnv* env, jclass, jstring jpath) {
            std::ostringstream out;
            const char* raw = jpath ? env->GetStringUTFChars(jpath, nullptr) : nullptr;
            std::string nativeDir = raw ? raw : "";
            if (raw) env->ReleaseStringUTFChars(jpath, raw);
          
            // Controls and Meta private runtime IPC gates: read-only linker calls.
            inspectLib(out, "PUBLIC_CONTROL", "liblog.so", "__android_log_print");
            inspectLib(out, "FPHAL", "libhzos_fphal.meta.so", "HzuFpHalBroker_getService");
            inspectLib(out, "RIPC_CLIENT", "libripcclient.oculus.so", "ipc_ConnectToServerExt");
            inspectLib(out, "BODYAPI_BASENAME", "libbodyapiplugin.so", "trex_GetPluginInfo");
            if (!nativeDir.empty() && nativeDir[0] == '/') {
              inspectLib(out, "BODYAPI_PACKAGE_DIR", nativeDir + "/libbodyapiplugin.so", "trex_GetPluginInfo");
            }
            inspectLib(out, "BODYAPI_SYSTEM_APK_ZIP",
                "/system_ext/priv-app/BodyApiService/BodyApiService.apk!/lib/arm64-v8a/libbodyapiplugin.so",
                "trex_GetPluginInfo");
            inspectLib(out, "NEGATIVE_CONTROL", "libdoesnotexist_probe_2026.so", nullptr);
          
            // Binder handles do not give IPC access, but make a useful comparison.
            dlerror();
            void* binderLib = dlopen("libbinder_ndk.so", RTLD_NOW | RTLD_LOCAL);
            if (!binderLib) {
              out << "BINDER_LIBRARY=FAIL ERROR=" << errorOrNone() << "\n";
            } else {
              void* checkRaw = dlsym(binderLib, "AServiceManager_checkService");
              void* pingRaw = dlsym(binderLib, "AIBinder_ping");
              void* releaseRaw = dlsym(binderLib, "AIBinder_decStrong");
              const char* names[] = {
                "oculus.internal.IRuntimeIpcBroker/default",
                "oculus.internal.tracking.IInsideOutBodyTrackingService/default",
                "oculus.internal.tracking.IMemoryBrokerService/default",
                "com.example.ipcprobe.not.real"
              };
              for (const char* name : names)
                checkBinder(out, name, binderLib, checkRaw, pingRaw, releaseRaw);
              dlclose(binderLib);
            }
            return env->NewStringUTF(out.str().c_str());
          }
          __IPCPROBE_FILE_8__
      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-RuntimeIPC-Preflight-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
